name: app_depil
description: SaaS de agendamento e controle financeiro para depiladoras
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI
  cupertino_icons: ^1.0.6
  table_calendar: ^3.1.2    # calendário de agendamentos
  fl_chart: ^0.68.0          # gráficos no DRE
  shimmer: ^3.0.0            # loading skeleton

  # Utilities
  intl: ^0.19.0              # formatação de datas e moeda BR
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

  # Forms
  flutter_form_builder: ^9.4.0
  form_builder_validators: ^10.0.1

  # Local notifications (lembretes - futuro)
  # flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
